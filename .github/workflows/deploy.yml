name: deploy

# Сборка на GitHub и выкладка на сервер. Секреты: DEPLOY_HOST, DEPLOY_SSH_KEY, SMTP_PASS (пароль почты для писем).
# Почта: SMTP_USER/SMTP_HOST ниже (по умолчанию Яндекс).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      setup:
        description: 'Сначала настроить сервер (первый запуск или изменения в deploy/setup.sh)'
        type: boolean
        default: false
      domain:
        description: 'Домен сайта (например, 24rentflow.ru); www и sslip.io добавятся сами'
        type: string
        default: '24rentflow.ru'

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx next typegen && npx tsc --noEmit -p .
      - run: npm run build
      - name: Собрать архив
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/
          cp -r drizzle scripts .next/standalone/
          cp -r node_modules/nodemailer .next/standalone/node_modules/
          tar -czf release.tgz -C .next/standalone .
      - name: SSH
        if: env.HAS_HOST == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/id root@$HOST" >> $GITHUB_ENV
          echo "SCP=scp -i $HOME/.ssh/id" >> $GITHUB_ENV
      - name: Настроить сервер
        if: env.HAS_HOST == 'true' && inputs.setup
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          D="$DOMAIN www.$DOMAIN $(echo "$HOST" | tr . -).sslip.io"
          D="$(echo $D)"
          $SCP deploy/setup.sh root@$HOST:/root/setup.sh
          set +e
          $SSH "bash /root/setup.sh '$D'" 2>&1 | tee setup.log
          code=${PIPESTATUS[0]}
          # Ключевые строки — в аннотации, чтобы их было видно в сводке запуска.
          grep -E "skip |setup done|основной домен|ни один|Certificate|certbot|rate|Error|error|failed" setup.log | tail -15 | sed 's/^/::warning::/'
          exit $code
      - name: Выложить
        if: env.HAS_HOST == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_USER: ${{ vars.SMTP_USER || 'rentflow@yandex.com' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.yandex.ru' }}
          APP_URL: https://${{ inputs.domain || '24rentflow.ru' }}
        run: |
          # Настройки почты — в отдельный файл; release.sh перенесёт их в /etc/rent-crm.env.
          umask 077
          {
            echo "APP_URL=$APP_URL"
            if [ -n "$SMTP_PASS" ]; then
              printf 'SMTP_HOST=%s\nSMTP_PORT=465\nSMTP_USER=%s\nSMTP_PASS="%s"\nMAIL_FROM="Расчётка <%s>"\n' "$SMTP_HOST" "$SMTP_USER" "$SMTP_PASS" "$SMTP_USER"
            fi
          } > mail.env
          $SCP mail.env root@$HOST:/root/mail.env
          rm -f mail.env
          $SCP release.tgz deploy/release.sh root@$HOST:/root/
          $SSH "bash /root/release.sh /root/release.tgz" 2>&1 | tee release.log
          code=${PIPESTATUS[0]}
          grep -E "^mail:" release.log | sed 's/^/::warning::/' || true
          exit $code
